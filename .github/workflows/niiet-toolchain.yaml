name: NIIET baremetal toolchain

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  LLVM_COMMIT: ca7933e47d3a3451d81e72ac174dcb5aa28b59d1
jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Checkout pinned LLVM 22.1.8
        shell: bash
        run: |
          git submodule update \
            --init \
            --depth 1 \
            llvm
          actual="$(
            git -C llvm rev-parse HEAD
          )"
          echo "LLVM commit: $actual"
          test \
            "$actual" = \
            "$LLVM_COMMIT"
      - name: Free disk space
        run: sudo ./.github/cleanup-rootfs.sh
      - name: Disk before
        run: df -h / /mnt
      - name: Build image
        run: |
          docker build \
            -t niiet-rv-linux \
            --build-arg BASE=quay.io/pypa/manylinux2014_x86_64 \
            -f build/Dockerfile.linux \
            build/
      - name: Cache patched GNU sources
        id: src
        uses: actions/cache@v5
        with:
          path: /mnt/sources
          key: >-
            niiet-src-linux-x86_64-${{
              hashFiles(
                'patch/riscv-*.patch',
                'build/prepare-sources.sh'
              )
            }}
      - name: Prepare patched GNU sources
        if: steps.src.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /mnt/sources
          sudo chown \
            "$USER" \
            /mnt/sources
          SOURCES=/mnt/sources \
            bash build/prepare-sources.sh
      - name: Build GCC + LLVM + package and verify multilibs
        run: |
          sudo mkdir -p \
            /mnt/work \
            /mnt/prefix \
            /mnt/out
          sudo chown \
            "$USER" \
            /mnt/work \
            /mnt/prefix \
            /mnt/out
          docker run \
            --rm \
            -v "$PWD":/src \
            -v /mnt/sources:/sources \
            -v /mnt/work:/work \
            -v /mnt/prefix:/opt/riscv \
            -v /mnt/out:/out \
            niiet-rv-linux \
            bash -c '
              set -e
              /src/build/build-baremetal.sh all
              PREFIX=/opt/riscv \
                bash /src/build/verify-multilib.sh
            '
      - name: Disk after
        if: always()
        run: df -h / /mnt
      - uses: actions/upload-artifact@v7
        with:
          name: >-
            riscv32-imafdc-elf-x86_64-linux-gcc-clang
          path: /mnt/out/*.tar.xz
          compression-level: 0
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - name: Checkout pinned LLVM 22.1.8
        shell: bash
        run: |
          git submodule update \
            --init \
            --depth 1 \
            llvm
          actual="$(
            git -C llvm rev-parse HEAD
          )"
          echo "LLVM commit: $actual"
          test \
            "$actual" = \
            "$LLVM_COMMIT"
      - name: Install build dependencies
        run: |
          brew install \
            flock \
            bison \
            gawk \
            gnu-sed \
            make \
            gmp \
            mpfr \
            libmpc \
            isl \
            expat \
            ninja \
            cmake \
            autoconf \
            automake \
            libtool \
            texinfo \
            python@3.11
      - name: Cache patched GNU sources
        id: src
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/sources
          key: >-
            niiet-src-arm64-macos-${{
              hashFiles(
                'patch/riscv-*.patch',
                'build/prepare-sources.sh'
              )
            }}
      - name: Prepare patched GNU sources
        if: steps.src.outputs.cache-hit != 'true'
        run: |
          SOURCES="$GITHUB_WORKSPACE/sources" \
            bash build/prepare-sources.sh
      - name: Build GCC + LLVM + package and verify multilibs
        run: |
          B="$(
            brew --prefix
          )/opt"
          export PATH="$B/flock/bin:$B/bison/bin:$B/gnu-sed/libexec/gnubin:$B/gawk/libexec/gnubin:$B/make/libexec/gnubin:$PATH"
          export LDFLAGS="-L$B/gmp/lib -L$B/mpfr/lib -L$B/libmpc/lib -L$B/isl/lib"
          export CPPFLAGS="-I$B/gmp/include -I$B/mpfr/include -I$B/libmpc/include -I$B/isl/include"

          SRC="$GITHUB_WORKSPACE" \
          SOURCES="$GITHUB_WORKSPACE/sources" \
          WORK="$GITHUB_WORKSPACE/work" \
          PREFIX="$GITHUB_WORKSPACE/install/riscv" \
          OUT="$GITHUB_WORKSPACE/out" \
            bash build/build-baremetal.sh all

          PREFIX="$GITHUB_WORKSPACE/install/riscv" \
            bash build/verify-multilib.sh
      - uses: actions/upload-artifact@v7
        with:
          name: >-
            riscv32-imafdc-elf-arm64-macos-gcc-clang
          path: out/*.tar.xz
          compression-level: 0

  windows-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Checkout pinned LLVM 22.1.8
        shell: bash
        run: |
          git submodule update \
            --init \
            --depth 1 \
            llvm
          actual="$(
            git -C llvm rev-parse HEAD
          )"
          echo "LLVM commit: $actual"
          test \
            "$actual" = \
            "$LLVM_COMMIT"
      - name: Free disk space
        run: |
          sudo ./.github/cleanup-rootfs.sh
      - name: Install build deps + Linux-hosted mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            build-essential \
            autoconf \
            automake \
            libtool \
            texinfo \
            bison \
            flex \
            gawk \
            gettext \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            zlib1g-dev \
            cmake \
            ninja-build \
            python3 \
            curl \
            xz-utils \
            file
          sudo update-alternatives \
            --set \
            x86_64-w64-mingw32-gcc \
            /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives \
            --set \
            x86_64-w64-mingw32-g++ \
            /usr/bin/x86_64-w64-mingw32-g++-posix
      - name: Cache patched GNU sources
        id: src
        uses: actions/cache@v5
        with:
          path: /mnt/sources
          key: >-
            niiet-src-windows-x86_64-${{
              hashFiles(
                'patch/riscv-*.patch',
                'build/prepare-sources.sh'
                 )
               }}
      - name: Prepare patched GNU sources
        if: steps.src.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /mnt/sources
          sudo chown \
            "$USER" \
            /mnt/sources
          SOURCES=/mnt/sources \
            bash build/prepare-sources.sh
      - name: Build GCC + GDB Canadian-cross
        run: |
          sudo mkdir -p \
            /mnt/work \
            /mnt/prefix-win \
            /mnt/out
          sudo chown \
            "$USER" \
            /mnt/work \
            /mnt/prefix-win \
            /mnt/out
          SRC="$PWD" \
          SOURCES=/mnt/sources \
          WORK=/mnt/work \
          PREFIX=/mnt/prefix-win \
          OUT=/mnt/out \
          WITH_HOST=x86_64-w64-mingw32 \
            bash build/build-baremetal.sh gcc
      - name: Build upstream LLVM/Clang Canadian-cross
        run: |
          SRC="$PWD" \
          SOURCES=/mnt/sources \
          WORK=/mnt/work \
          PREFIX=/mnt/prefix-win \
          OUT=/mnt/out \
          WITH_HOST=x86_64-w64-mingw32 \
            bash build/build-baremetal.sh clang
      - name: Package Windows SDK
        run: |
          SRC="$PWD" \
          PREFIX=/mnt/prefix-win \
          OUT=/mnt/out \
          WITH_HOST=x86_64-w64-mingw32 \
            bash build/build-baremetal.sh package
      - name: Inspect Windows host tools
        run: |
          file \
            /mnt/prefix-win/bin/riscv32-unknown-elf-gcc.exe
          file \
            /mnt/prefix-win/bin/clang.exe
          file \
            /mnt/prefix-win/bin/clangd.exe
          file \
            /mnt/prefix-win/bin/clang-format.exe
          file \
            /mnt/prefix-win/bin/clang-tidy.exe
      - uses: actions/upload-artifact@v7
        with:
          name: >-
            riscv32-imafdc-elf-x86_64-windows-gcc-clang
          path: /mnt/out/*.tar.xz
          compression-level: 0
