name: NIIET baremetal toolchain

# Builds the rv32imafdc_zicsr_zifencei baremetal toolchain (GCC + clang/lld from
# Syntacore's snippy LLVM, reduced rv32 multilib, newlib + newlib-nano) for:
#   - Linux x86_64   (AlmaLinux 8 / glibc 2.28 -> portable)   [VALIDATED recipe]
#   - macOS arm64    (native)                                  [experimental]
#   - Windows x86_64 (mingw canadian-cross, GNU only)          [experimental: clang TODO]
#
# Manual trigger (and on version tags). See build/BUILD-NOTES.md.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        run: sudo ./.github/cleanup-rootfs.sh
      - name: Disk before
        run: df -h / /mnt
      - name: Build image
        run: docker build -t niiet-rv-linux -f build/Dockerfile.linux build/
      - name: Cache patched sources
        id: src
        uses: actions/cache@v5
        with:
          path: /mnt/sources
          key: niiet-src-linux-${{ hashFiles('patch/riscv-*.patch') }}-v1
      - name: Prepare sources
        if: steps.src.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /mnt/sources && sudo chown "$USER" /mnt/sources
          SOURCES=/mnt/sources bash build/prepare-sources.sh
      - name: Build (gcc + clang + package)
        run: |
          sudo mkdir -p /mnt/work /mnt/prefix /mnt/out
          sudo chown "$USER" /mnt/work /mnt/prefix /mnt/out
          docker run --rm \
            -v "$PWD":/src -v /mnt/sources:/sources \
            -v /mnt/work:/work -v /mnt/prefix:/opt/riscv -v /mnt/out:/out \
            niiet-rv-linux \
            bash -c 'source /opt/rh/gcc-toolset-12/enable; /src/build/build-baremetal.sh all'
      - name: Disk after
        if: always()
        run: df -h / /mnt
      - uses: actions/upload-artifact@v7
        with:
          name: riscv32-imafdc-elf-x86_64-linux-gcc-clang
          path: /mnt/out/*.tar.xz
          compression-level: 0

  macos-arm64:
    runs-on: macos-14
    continue-on-error: true        # experimental until shaken out on the runner
    steps:
      - uses: actions/checkout@v6
      - name: Install build deps
        # 'flock' is required by the toolchain Makefile (sysroot install lock) and is
        # absent on macOS; GNU bison/sed/make/gawk must also precede the system ones.
        run: |
          brew install flock bison gawk gnu-sed make gmp mpfr libmpc isl expat \
                       ninja cmake autoconf automake libtool texinfo python@3.11
      - name: Cache patched sources
        id: src
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/sources
          key: niiet-src-macos-${{ hashFiles('patch/riscv-*.patch') }}-v1
      - name: Prepare sources
        if: steps.src.outputs.cache-hit != 'true'
        run: SOURCES="$GITHUB_WORKSPACE/sources" bash build/prepare-sources.sh
      - name: Build (gcc + clang + package)
        # NOTE: macOS source trees may need a case-sensitive volume (see macos-build.md).
        run: |
          B=/opt/homebrew/opt
          export PATH="$B/flock/bin:$B/bison/bin:$B/gnu-sed/libexec/gnubin:$B/gawk/libexec/gnubin:$B/make/libexec/gnubin:$PATH"
          # Homebrew installs gmp/mpfr/mpc/isl under /opt/homebrew/opt; configure
          # (gdb/gcc) doesn't search there by default.
          export LDFLAGS="-L$B/gmp/lib -L$B/mpfr/lib -L$B/libmpc/lib -L$B/isl/lib"
          export CPPFLAGS="-I$B/gmp/include -I$B/mpfr/include -I$B/libmpc/include -I$B/isl/include"
          SRC="$GITHUB_WORKSPACE" SOURCES="$GITHUB_WORKSPACE/sources" \
          WORK="$GITHUB_WORKSPACE/work" PREFIX="$GITHUB_WORKSPACE/install/riscv" \
          OUT="$GITHUB_WORKSPACE/out" \
            bash build/build-baremetal.sh all
      - uses: actions/upload-artifact@v7
        with:
          name: riscv32-imafdc-elf-arm64-macos-gcc-clang
          path: out/*.tar.xz
          compression-level: 0

  windows-x86_64:
    # Canadian cross from the Linux container: GNU toolchain (gcc/binutils/newlib/gdb)
    # hosted on Windows. gdb gets host gmp/mpfr cross-built into the mingw sysroot
    # (build/prepare-mingw-deps.sh). clang-for-Windows cross is not wired yet
    # (build-baremetal.sh skips clang when WITH_HOST is set) — follow-up: mingw
    # toolchain file + native llvm-tblgen.
    runs-on: ubuntu-24.04
    continue-on-error: true        # experimental
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        run: sudo ./.github/cleanup-rootfs.sh
      - name: Build image
        run: docker build -t niiet-rv-linux -f build/Dockerfile.linux build/
      - name: Cache patched sources
        id: src
        uses: actions/cache@v5
        with:
          path: /mnt/sources
          key: niiet-src-linux-${{ hashFiles('patch/riscv-*.patch') }}-v1
      - name: Prepare sources
        if: steps.src.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /mnt/sources && sudo chown "$USER" /mnt/sources
          SOURCES=/mnt/sources bash build/prepare-sources.sh
      - name: Build (gcc canadian-cross to mingw)
        run: |
          sudo mkdir -p /mnt/work /mnt/prefix-win /mnt/out
          sudo chown "$USER" /mnt/work /mnt/prefix-win /mnt/out
          docker run --rm \
            -v "$PWD":/src -v /mnt/sources:/sources \
            -v /mnt/work:/work -v /mnt/prefix-win:/opt/riscv-win -v /mnt/out:/out \
            -e WITH_HOST=x86_64-w64-mingw32 \
            niiet-rv-linux \
            bash -c 'source /opt/rh/gcc-toolset-12/enable; SRC=/src PREFIX=/opt/riscv-win OUT=/out /src/build/build-baremetal.sh gcc && SRC=/src PREFIX=/opt/riscv-win OUT=/out /src/build/build-baremetal.sh package'
      - uses: actions/upload-artifact@v7
        with:
          name: riscv32-imafdc-elf-x86_64-windows-gcc
          path: /mnt/out/*.tar.xz
          compression-level: 0
