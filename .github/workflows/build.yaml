name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-host-link-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Test host runtime link configuration
        run: |
          bash build/test-build-config.sh all
          bash build/test-fetch-source.sh

  build:
    uses: ./.github/workflows/build-reusable.yaml
    with:
      artifact-name: build

  test-sim:
    uses: ./.github/workflows/build-reusable.yaml
    with:
      artifact-name: sim
      os: '["ubuntu-24.04"]'
      mode: '["newlib"]'
      target: '["rv64gc-lp64d"]'
      sim: '["spike"]'

  build-multilib:
    if: ${{ false }} # Disable until multilib errors are triaged
    uses: ./.github/workflows/build-reusable.yaml
    with:
      artifact-name: multilib
      os: '["ubuntu-24.04"]'
      mode: '["newlib","linux"]'
      target: '["rv64gc-lp64d"]'
